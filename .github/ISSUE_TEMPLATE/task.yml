name: Задача
description: Новая возможность или технический шаг из плана
labels: ["задача"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Что должно получиться
      description: Результат глазами того, кто им пользуется.
      placeholder: >-
        Администратор отмечает 1 января выходным, и слоты на эту дату
        перестают предлагаться покупателю.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Чем проверяется
      description: >-
        Обязательное поле. «Сделано» в этом проекте значит «есть тест,
        который краснеет без изменения», а не «работает у меня».
      placeholder: >-
        test_calc_slots.py: дата из списка исключений не даёт свободных слотов;
        проверено подменой — без фильтра тест падает.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Что можно сломать
      description: >-
        Задевается ли расчёт денег (он общий у сервера и браузера),
        контракт API или схема базы. Если нужна миграция — упомянуть здесь.
