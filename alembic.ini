# Alembic — версионирование схемы базы.
#
# Строки подключения здесь НЕТ намеренно: она собирается из FC_DB_* и
# .env в `backend/app/config.py`, и дублировать её тут значило бы завести
# второе место, где живёт пароль от боевой базы. `env.py` берёт её сам.
#
# Запуск — из корня проекта:
#
#     alembic revision --autogenerate -m "что меняем"
#     alembic upgrade head
#     alembic current          # какая ревизия стоит на базе
#     alembic history          # что вообще есть

[alembic]
script_location = backend/alembic

# Имя файла ревизии: дата впереди, чтобы порядок совпадал с историей.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
